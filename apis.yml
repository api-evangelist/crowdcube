name: crowdcube
description: Crowdcube is a UK-based equity crowdfunding platform that lets everyday and professional
  investors buy shares in early-stage and growth-stage private companies, and lets founders raise
  capital directly from their community and the wider crowd. Founded in 2011 in Exeter by Darren
  Westlake and Luke Lang, it is authorised and regulated by the UK Financial Conduct Authority (FCA)
  and has helped hundreds of startups and scale-ups raise funding from a large base of retail
  investors. The platform covers pitch discovery, investment processing, share issuance, nominee
  shareholding, and a secondary-market cashout facility. Crowdcube surfaced in the API Evangelist
  network as a portfolio company of Balderton Capital. It does not currently publish a public
  developer API, SDKs, or developer portal; this profile captures its company identity and observable
  domain-security posture.
